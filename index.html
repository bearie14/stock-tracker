<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0c1220 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 缩放控制面板（右侧固定）===== */
        .zoom-panel {
            position: fixed;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .zoom-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid rgba(0,119,204,0.35);
            background: rgba(12,18,32,0.94);
            color: #64b5f6;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            backdrop-filter: blur(8px);
            user-select: none;
            font-family: inherit;
        }
        .zoom-btn:hover {
            background: rgba(0,119,204,0.28);
            border-color: rgba(0,119,204,0.65);
            color: #fff;
            transform: scale(1.1);
        }
        .zoom-btn:active { transform: scale(0.93); }

        .zoom-slider-wrap {
            width: 38px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 垂直滑块 */
        .zoom-slider-vert {
            writing-mode: vertical-lr;
            direction: rtl;
            appearance: slider-vertical;
            width: 120px;
            height: 6px;
            accent-color: #0077cc;
            cursor: pointer;
            transform: rotate(180deg);
        }

        .zoom-label {
            width: 38px;
            height: 26px;
            border-radius: 7px;
            border: 1px solid rgba(0,119,204,0.35);
            background: rgba(12,18,32,0.94);
            color: #64b5f6;
            font-size: 0.63em;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            letter-spacing: -0.3px;
        }

        /* ===== 缩放包裹层 ===== */
        #zoomWrapper {
            transform-origin: top center;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            padding: 28px 20px 22px;
            background: linear-gradient(135deg, rgba(0,119,204,0.18) 0%, rgba(0,68,136,0.18) 100%);
            border-radius: 16px;
            margin: 18px 20px 24px;
            border: 1px solid rgba(0,119,204,0.28);
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0077cc, #00a8e8, #0077cc);
            background-size: 200% auto;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 200% center; }
            100% { background-position: -200% center; }
        }
        .header h1 {
            font-size: 2.0em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00d4ff, #0077cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p { color: #8892b0; font-size: 1.05em; }

        .update-time {
            display: inline-block;
            margin-top: 12px;
            padding: 7px 18px;
            background: rgba(0,119,204,0.13);
            border-radius: 20px;
            font-size: 0.88em;
            color: #64b5f6;
        }

        /* ===== 首页汇总统计面板 ===== */
        .summary-panel {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .summary-item {
            text-align: center;
            padding: 10px 18px;
            background: rgba(0,0,0,0.22);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            min-width: 80px;
        }
        .summary-label {
            font-size: 0.72em;
            color: #8892b0;
            margin-bottom: 4px;
        }
        .summary-value {
            font-size: 1.2em;
            font-weight: 700;
        }
        .summary-value.up   { color: #ff4d4d; }
        .summary-value.down { color: #00c853; }
        .summary-value.flat { color: #ff9800; }
        .summary-value.neutral { color: #e0e0e0; }

        /* ===== 分类板块 ===== */
        .category {
            margin-bottom: 22px;
            background: rgba(255,255,255,0.025);
            border-radius: 12px;
            padding: 18px 20px;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.25s ease;
            margin-left: 20px;
            margin-right: 20px;
        }
        .category:hover {
            border-color: rgba(0,119,204,0.28);
            box-shadow: 0 4px 18px rgba(0,119,204,0.08);
        }
        .category-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 13px;
            padding-left: 14px;
            border-left: 4px solid #0077cc;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }
        .category-stats {
            font-size: 0.72em;
            color: #8892b0;
            font-weight: normal;
        }

        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 11px;
        }

        /* ===== 股票卡片 ===== */
        .stock-card {
            background: rgba(255,255,255,0.045);
            border-radius: 10px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.07);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .stock-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0,119,204,0.35);
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }
        .stock-card.up   { border-left: 3px solid #ff4d4d; }
        .stock-card.down { border-left: 3px solid #00c853; }
        .stock-card.flat { border-left: 3px solid #8892b0; }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
        }
        .stock-name { font-weight: 600; font-size: 1.05em; color: #fff; }
        .stock-code {
            font-size: 0.78em;
            color: #8892b0;
            background: rgba(255,255,255,0.05);
            padding: 2px 7px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .stock-price-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .stock-price {
            font-size: 1.7em;
            font-weight: 700;
            font-family: 'Courier New', monospace;
        }
        .stock-change { text-align: right; }
        .change-percent { font-size: 1.15em; font-weight: 600; }
        .change-amount { font-size: 0.82em; opacity: 0.8; }

        .up   .stock-price, .up   .change-percent, .up   .change-amount { color: #ff4d4d; }
        .down .stock-price, .down .change-percent, .down .change-amount { color: #00c853; }
        .flat .stock-price, .flat .change-percent, .flat .change-amount { color: #8892b0; }

        .stock-extra {
            margin-top: 9px;
            padding-top: 9px;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            font-size: 0.78em;
            color: #8892b0;
        }

        /* ===== 加载遮罩 ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(12,18,32,0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(0,119,204,0.25);
            border-top-color: #0077cc;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            margin-bottom: 18px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== 刷新按钮 ===== */
        .refresh-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 54px; height: 54px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0077cc, #0055aa);
            border: none;
            color: #fff;
            font-size: 1.45em;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,119,204,0.38);
            transition: all 0.25s ease;
            z-index: 1000;
        }
        .refresh-btn:hover {
            transform: scale(1.12);
            box-shadow: 0 6px 20px rgba(0,119,204,0.55);
        }
        .refresh-btn.spinning { animation: spin 1s linear infinite; }

        /* ===== 市场状态灯 ===== */
        .market-status {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        .market-open  { background: #00c853; }
        .market-closed { background: #ff4d4d; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

        .unlisted { color: #ff9800 !important; }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .stock-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5em; }
            body { padding: 8px; }
            .category-title { font-size: 1.05em; }
            .zoom-panel { display: none; }
        }
    </style>
</head>

// ========== 全局状态 ==========
let stockData = {};
let refreshInterval = null;
let currentZoom = 100;
const ZOOM_STEP = 10;

// ========== 缩放功能 ==========
function applyZoom(pct) {
    pct = Math.round(Math.max(30, Math.min(150, pct)));
    currentZoom = pct;
    var wrapper = document.getElementById('zoomWrapper');
    var label   = document.getElementById('zoomLabel');
    var slider  = document.getElementById('zoomSlider');
    var scale   = pct / 100;

    wrapper.style.transform = 'scale(' + scale + ')';

    // 用 transform-origin 控制缩放锚点
    wrapper.style.transformOrigin = 'top center';

    // 防止缩放后底部留白：设置 minHeight 补偿
    var h = wrapper.scrollHeight;
    wrapper.style.minHeight = h + 'px';

    label.textContent = pct + '%';
    slider.value     = pct;

    try { localStorage.setItem('stockZoom', pct); } catch(e) {}
}

function zoomIn()   { applyZoom(currentZoom + ZOOM_STEP); }
function zoomOut()  { applyZoom(currentZoom - ZOOM_STEP); }
function zoomReset() { applyZoom(100); }
function zoomMin()   { applyZoom(30); }

function onSliderChange(val) {
    applyZoom(parseInt(val, 10));
}

// 自适应窗口：计算最大不失真缩放比
function zoomFit() {
    var wrapper = document.getElementById('zoomWrapper');
    var W = window.innerWidth - 40;
    var H = window.innerHeight - 40;
    var w = wrapper.scrollWidth;
    var h = wrapper.scrollHeight;
    if (w === 0 || h === 0) return;
    var scaleX = W / w;
    var scaleY = H / h;
    var scale   = Math.min(scaleX, scaleY, 1) * 100;
    applyZoom(Math.max(30, Math.round(scale / 5) * 5));
}

// 键盘快捷键 Ctrl+/-/0
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey || e.metaKey) {
        if (e.key === '=' || e.key === '+') { e.preventDefault(); zoomIn(); }
        if (e.key === '-')                  { e.preventDefault(); zoomOut(); }
        if (e.key === '0')                  { e.preventDefault(); zoomReset(); }
    }
});

// 窗口变化时自动修正横向溢出
window.addEventListener('resize', function() {
    var wrapper = document.getElementById('zoomWrapper');
    var scale   = currentZoom / 100;
    if (wrapper.scrollWidth * scale > window.innerWidth + 5) {
        applyZoom(currentZoom - 5);
    }
});

                        '<span class="stock-code">' + stock.code.substring(2) + '</span>' +
                    '</div>' +
                    '<div class="stock-price-info">' +
                        '<span class="stock-price">--</span>' +
                        '<div class="stock-change">' +
                            '<div class="change-percent">--%</div>' +
                            '<div class="change-amount">--</div>' +
                        '</div>' +
                    '</div>' +
                    '<div class="stock-extra">' +
                        '<span>今开: <span class="open-price">--</span></span>' +
                        '<span>最高: <span class="high-price">--</span></span>' +
                    '</div>';
            } else {
                card.innerHTML =
                    '<div class="stock-header">' +
                        '<span class="stock-name">' + stock.name + '</span>' +
                        '<span class="stock-code unlisted">' + (stock.note || '未上市') + '</span>' +
                    '</div>' +
                    '<div class="stock-price-info">' +
                        '<span class="stock-price unlisted" style="font-size:1.2em;">--</span>' +
                    '</div>';
            }
            grid.appendChild(card);
        });
    });
}

// ========== 获取行情数据 ==========
function fetchAllStockData() {
    var codes = [];
    stockCategories.forEach(function(cat) {
        cat.stocks.forEach(function(s) {
            if (s.code) codes.push(s.code);
        });
    });

    // 分批，每批最多40个
    var BATCH = 40;
    for (var i = 0; i < codes.length; i += BATCH) {
        (function(batch) {
            setTimeout(function() { fetchBatch(batch); }, (i / BATCH) * 80);
        })(codes.slice(i, i + BATCH));
    }

    var now = new Date();
    var ts = now.getHours().toString().padStart(2,'0') + ':' +
              now.getMinutes().toString().padStart(2,'0') + ':' +
              now.getSeconds().toString().padStart(2,'0');
    document.getElementById('lastUpdate').textContent = ts;
}

function fetchBatch(codes) {
    var script = document.createElement('script');
    script.src = 'https://qt.gtimg.cn/q=' + codes.join(',');
    script.onload = function() {
        codes.forEach(function(code) {
            var v = window['v_' + code];
            if (v) {
                processStock(code, v);
                try { delete window['v_' + code]; } catch(e) {}
            }
        });
        try { document.head.removeChild(script); } catch(e) {}
        checkLoadingDone();
    };
    script.onerror = function() {
        try { document.head.removeChild(script); } catch(e) {}
        checkLoadingDone();
    };
    document.head.appendChild(script);
}

var loadedBatches = 0;
var totalBatches  = 0;

function checkLoadingDone() {
    loadedBatches++;
    if (loadedBatches >= totalBatches) {
        var el = document.getElementById('loadingOverlay');
        if (el) el.classList.add('hidden');
    }
}

// ========== 解析单只股票 ==========
function processStock(code, dataStr) {
    if (!dataStr) return;
    var p = dataStr.split('~');
    if (p.length < 36) return;

    var price = parseFloat(p[3]);
    var close = parseFloat(p[4]);
    var open  = parseFloat(p[5]);
    var high  = parseFloat(p[33]);
    var change = price - close;
    var pct   = close > 0 ? (change / close) * 100 : 0;

    stockData[code] = {
        name: p[1],
        code: code,
        price: price,
        close: close,
        open: open,
        high: high,
        change: change,
        pct: pct
    };
    updateDisplay(code, stockData[code]);
}

// ========== 更新 DOM ==========
function updateDisplay(code, info) {
    stockCategories.forEach(function(cat, ci) {
        cat.stocks.forEach(function(stock, si) {
            if (stock.code !== code) return;
            var card = document.getElementById('stock-' + ci + '-' + si);
            if (!card) return;

            var dir = 'flat';
            if (info.pct > 0)  dir = 'up';
            else if (info.pct < 0) dir = 'down';
            card.className = 'stock-card ' + dir;

            var pe = card.querySelector('.stock-price');
            if (pe) pe.textContent = info.price.toFixed(2);

            var cp = card.querySelector('.change-percent');
            if (cp) cp.textContent = (info.pct >= 0 ? '+' : '') + info.pct.toFixed(2) + '%';

            var ca = card.querySelector('.change-amount');
            if (ca) ca.textContent = (info.change >= 0 ? '+' : '') + info.change.toFixed(2);

            var oe = card.querySelector('.open-price');
            if (oe) oe.textContent = info.open.toFixed(2);

            var he = card.querySelector('.high-price');
            if (he) he.textContent = info.high.toFixed(2);
        });
    });
    updateCategoryStats();
}

function updateCategoryStats() {
    stockCategories.forEach(function(cat, ci) {
        var up = 0, down = 0, sum = 0, cnt = 0;
        cat.stocks.forEach(function(s) {
            if (s.code && stockData[s.code]) {
                var d = stockData[s.code];
                if (d.pct > 0)  up++;
                else if (d.pct < 0) down++;
                sum += d.pct;
                cnt++;
            }
        });
        var el = document.getElementById('stats-' + ci);
        if (el && cnt > 0) {
            var avg = sum / cnt;
            var color = avg >= 0 ? '#ff4d4d' : '#00c853';
            el.innerHTML = '<span style="color:#ff4d4d;">' + up + '涨</span> ' +
                           '<span style="color:#00c853;">' + down + '跌</span> ' +
                           '均: <span style="color:' + color + '">' + (avg >= 0 ? '+' : '') + avg.toFixed(2) + '%</span>';
        }
    });
    updateGlobalSummary();
}

function updateGlobalSummary() {
    var totalUp = 0, totalDown = 0, totalFlat = 0, totalSum = 0, totalCnt = 0, unlisted = 0;

    stockCategories.forEach(function(cat) {
        cat.stocks.forEach(function(s) {
            if (!s.code) {
                unlisted++;
                return;
            }
            var d = stockData[s.code];
            if (d) {
                if (d.pct > 0)       totalUp++;
                else if (d.pct < 0)  totalDown++;
                else                 totalFlat++;
                totalSum += d.pct;
                totalCnt++;
            }
        });
    });

    var upEl = document.getElementById('sumUp');
    var downEl = document.getElementById('sumDown');
    var unlEl = document.getElementById('sumUnlisted');
    var avgEl = document.getElementById('sumAvg');

    if (upEl)   upEl.textContent   = totalUp;
    if (downEl) downEl.textContent = totalDown;
    if (unlEl)  unlEl.textContent  = unlisted;

    if (avgEl && totalCnt > 0) {
        var avg = totalSum / totalCnt;
        avgEl.textContent = (avg >= 0 ? '+' : '') + avg.toFixed(2) + '%';
        avgEl.className = 'summary-value ' + (avg > 0 ? 'up' : (avg < 0 ? 'down' : 'neutral'));
    } else if (avgEl) {
        avgEl.textContent = '--';
        avgEl.className = 'summary-value neutral';
    }
}

// ========== 手动刷新 ==========
function manualRefresh() {
    var btn = document.querySelector('.refresh-btn');
    btn.classList.add('spinning');
    fetchAllStockData();
    setTimeout(function() { btn.classList.remove('spinning'); }, 1200);
}

// ========== 启动 ==========
function init() {
    renderStructure();

    // 恢复上次缩放
    try {
        var saved = parseInt(localStorage.getItem('stockZoom'), 10);
        if (saved >= 30 && saved <= 150) currentZoom = saved;
    } catch(e) {}

    applyZoom(currentZoom);

    // 计算批次
    var codes = [];
    stockCategories.forEach(function(cat) {
        cat.stocks.forEach(function(s) { if (s.code) codes.push(s.code); });
    });
    totalBatches = Math.ceil(codes.length / 40);
    loadedBatches = 0;

    fetchAllStockData();
    refreshInterval = setInterval(fetchAllStockData, 8000);
}

document.addEventListener('DOMContentLoaded', init);

window.addEventListener('beforeunload', function() {
    if (refreshInterval) clearInterval(refreshInterval);
});
</script>
